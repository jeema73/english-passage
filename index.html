<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e8467c"><title>지문분석 학습지</title>
<style>
:root{--ink:#2f3e46;--fo:#3f6b4f;--ln:#d8cfb8;--co:#d9825b;--su:#e9b44c;--sk:#7fb5cc;--mo:#8fae7a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#f4efe0;color:var(--ink);font:15px/1.65 "Gowun Dodum",system-ui,"Apple SD Gothic Neo",sans-serif}
h2,h3,.top,.v,.tag,.ban,.chip{font-family:"Gowun Batang",serif}
.top{padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;text-align:center;background:linear-gradient(#bfdde8,#f4efe0)}
#ttl{font-size:22px;font-weight:700;color:var(--fo)}#stat{font-size:12.5px;color:#6b705c}
nav{position:sticky;top:0;z-index:5;display:flex;background:#f4efe0;border-bottom:1px solid var(--ln)}

button.g,.btn.g{background:#fff;color:var(--fo);border:1.5px solid var(--fo)}button:disabled{opacity:.5}
.chk label{display:inline-block;margin:4px 10px 4px 0}.chk input{width:auto}
details{border-top:1px solid var(--ln)}summary{padding:9px 2px;font-weight:700;cursor:pointer;color:var(--fo)}summary small{color:#888;font-weight:400}
.it{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0}
.it small{color:#777;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:40vw}.it .a{display:flex;gap:4px}.it button{padding:4px 8px;font-size:12.5px}
.pg{background:#fffdf6;border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.ph{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--fo);padding-bottom:6px;margin-bottom:10px;flex-wrap:wrap}
.ph h2{margin:0;font-size:21px;flex:1}.tag{border:1.5px solid var(--fo);color:var(--fo);border-radius:99px;padding:1px 10px;font-size:12.5px}.sb{font-size:12px;color:#888}
.chips span{display:inline-block;background:#e8efd9;color:var(--fo);border-radius:99px;padding:1px 10px;margin:0 4px 6px 0;font-size:13px}
.g2{display:grid;grid-template-columns:3fr 2fr;gap:10px}
.ps{background:#fff6d9;border:2px solid var(--su);border-radius:14px;padding:10px}.ps h5{margin:0 0 4px;font-size:12.5px;color:#9a7412}
.en{font:15px/1.9 Georgia,"Gowun Batang",serif;margin:0}sup{color:var(--co);font-weight:700;margin-right:2px;font-size:10px}
mark{background:linear-gradient(transparent 55%,#f6c85f 55%)}.cn{color:var(--co);text-decoration:underline wavy}
.cds{display:grid;gap:6px;align-content:start}.cd{border-left:5px solid;border-radius:8px;background:#fff;padding:5px 8px;font-size:13.5px}
.cd.co{border-color:var(--co)}.cd.su{border-color:var(--su)}.cd.sk{border-color:var(--sk)}.cd.mo{border-color:var(--mo)}.cd.fo{border-color:var(--fo)}
.v{display:block;width:fit-content;break-after:avoid;margin:14px 0 6px;font-weight:700;font-size:16px;color:var(--fo);border-bottom:2px solid var(--mo)}
.fl{display:flex;gap:8px;flex-wrap:wrap}.fb{flex:1;min-width:110px;border:1.5px solid var(--sk);border-radius:10px;padding:6px 8px;background:#f1f8fb;font-size:13px}.fb small{display:block;color:#555}
.ko{font-size:13.5px;color:#444}.eye,.kp,.ck,.cheer{border-radius:12px;padding:10px;margin-top:12px;font-size:13.5px}
.eye{background:#eaf3e3;border:1.5px solid var(--mo)}.eye ol{margin:4px 0 0 18px;padding:0}
.ban{background:linear-gradient(90deg,#3f6b4f,#6a9a7a);color:#fff;border-radius:99px;text-align:center;padding:7px;font-size:16px;margin-bottom:10px}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st{border:1.5px solid var(--ln);border-radius:14px;padding:8px;background:#fff}
.chip{background:var(--co);color:#fff;border-radius:99px;padding:0 9px;font-size:12px;margin-right:6px}
.stb{display:flex;gap:6px;align-items:center;margin-top:4px}.stb svg{width:44%;height:auto;flex:none;border-radius:10px}.bub{background:#f4efe0;border-radius:10px;padding:6px 8px;font-size:12.5px;line-height:1.45}
.vs{display:flex;gap:8px;align-items:center}.vs>div{flex:1;border-radius:10px;padding:8px;font-size:13.5px}.ok{background:#e4f1e0;border:1.5px solid var(--mo)}.no{background:#fbe6dd;border:1.5px solid var(--co)}
.kp{background:#fff6d9;border:2px dashed var(--su)}.kp ul{margin:4px 0 0 16px;padding:0}
.sx{border-left:4px solid var(--sk);background:#f1f8fb;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:13.5px}.sx code{color:#b3532f;font-size:12.5px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th{background:#e8efd9;color:var(--fo)}th,td{border:1px solid var(--ln);padding:3px 6px}.s3{color:var(--su)}
.sen{margin:5px 0;font-size:13.5px}.sen b{color:var(--co)}.tg{background:#fbe6dd;border-radius:6px;padding:0 6px;font-size:12px}.hint{color:#999}.ln{border-bottom:1px dotted #aaa;height:22px}
.ck{background:#f1f8fb;border:1.5px solid var(--sk)}.cheer{text-align:center;background:#fbefe0;color:#9a4a22;font:19px "Nanum Pen Script","Gowun Dodum",cursive}
.sen,.sx,tr,.st,.cd,.fb{break-inside:avoid}
@media(max-width:560px){.g2,.stg{grid-template-columns:1fr}}
@media print{.top,nav,.np,section:not(#res){display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff}.pg{border:0;padding:0;margin:0;border-radius:0;break-after:page}.pg:last-child{break-after:auto}@page{size:A4;margin:10mm}}
</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap"></head><body>
<div class="top"><div id="ttl"></div><div id="stat"></div></div>
<nav><button onclick="tab('lib')">📚 지문</button><button onclick="tab('mk')">✏️ 만들기</button><button onclick="tab('res')">📄 학습지</button><button onclick="tab('set')">⚙️ 설정</button></nav>

<section id="lib">
<div class="card"><h3>지문 저장</h3>
<div class="row"><input id="ly" type="number" value="2026"><select id="lg" class="sg"></select><select id="lm" class="sm"></select><input id="ln" type="number" placeholder="번호"></div>
<textarea id="lt" rows="6" placeholder="지문(문제 전체)을 붙여넣으세요"></textarea>
<div class="row"><button onclick="savePassage()">저장</button><button class="g" onclick="clearForm()">새로 쓰기</button></div>
<div class="row"><label class="btn g">📥 PDF·한글(hwpx)·TXT 일괄 등록<input type="file" accept=".pdf,.txt,.hwpx,.hwp" hidden onchange="importFile(this.files[0]);this.value=''"></label></div>
<small>EBSi에서 받은 PDF를 고르면 위에서 선택한 연도·학년·월로 18~45번을 자동 분리해 저장합니다.</small></div>
<div class="card"><h3>보관함</h3><div class="row"><select id="fy" onchange="LIM=60;renderLib()"></select><select id="fg" onchange="LIM=60;renderLib()"></select><select id="fm" onchange="LIM=60;renderLib()"></select><input id="fn" placeholder="번호 (31 또는 30-35)" oninput="LIM=60;renderLib()"></div><input id="q" placeholder="글자 검색" oninput="LIM=60;renderLib()"><div id="plist"></div>
<div class="row"><button class="g" onclick="backup()">백업 저장</button><label class="btn g">백업 복원<input type="file" accept=".json" hidden onchange="restore(this.files[0]);this.value=''"></label></div></div>
</section>

<section id="mk" hidden><div class="card"><h3>학습지 만들기</h3>
<div class="row"><input id="my" type="number" value="2026"><select id="mg" class="sg"></select><select id="mm" class="sm"></select><input id="mn" type="number" placeholder="번호"></div>
<div class="row"><select id="mc"><option value="random">🎲 랜덤 (장면마다 5종 섞기)</option><option value="free">✨ AI 자유 캐릭터 (매번 새로)</option><option value="zola">졸라맨</option><option value="mickey">미키마우스</option><option value="peter">피터팬</option><option value="sherlock">셜록 홈즈</option><option value="pooh">곰돌이 푸</option></select></div>
<div class="chk"><label><input type="checkbox" id="o_sc" checked>그림 도식</label><label><input type="checkbox" id="o_vo" checked>어휘</label><label><input type="checkbox" id="o_gr" checked>어법·구문</label><label><input type="checkbox" id="o_ch" checked>선지 분석</label><label><input type="checkbox" id="o_qz" checked>확인문제</label></div>
<div class="row"><button id="gb" onclick="make()">✨ 학습지 생성</button></div><div id="st"></div></div></section>

<section id="res" hidden><div class="card np"><h3>만든 학습지</h3><div id="sl"></div></div>
<div class="row np" id="acts" hidden><button class="g" id="dn" onclick="fin()">🌱 학습 완료</button><button onclick="share()">📤 공유</button><button onclick="window.print()">🖨 PDF 저장·인쇄</button></div>
<div id="sheet"></div></section>

<section id="set" hidden><div class="card"><h3>설정</h3>
<label>Gemini API 키</label><input id="ck" type="password" autocomplete="off" placeholder="AI Studio에서 발급한 키">
<label>이름 애칭</label><input id="cn" placeholder="향이"><label>모델</label><input id="cm" placeholder="gemini-2.5-flash">
<div class="row"><button onclick="saveCfg()">저장</button></div>
<small>키는 이 폰의 브라우저에만 저장되며 Gemini 서버로만 전송됩니다.</small></div></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{alert('저장 공간이 부족합니다. 백업 후 오래된 항목을 삭제하세요.')}};
let P=LS('pp_p',[]),S=LS('pp_s',[]),cfg=LS('pp_c',{key:'',model:'gemini-2.5-flash'}),editId=null,cur=null;const NK=()=>cfg.nick||'향이';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=s=>{s=String(s||'');if(!/^\s*<svg/i.test(s))return'';return s.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi,'').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi,'').replace(/javascript:/gi,'')};
const num=n=>n>=1&&n<=20?String.fromCharCode(9311+n):'('+n+')';
document.querySelectorAll('.sg').forEach(e=>{e.innerHTML=[1,2,3].map(g=>`<option value="${g}">고${g}</option>`).join('')});
document.querySelectorAll('.sm').forEach(e=>{e.innerHTML=[3,4,5,6,7,9,10,11].map(m=>`<option value="${m}">${m}월</option>`).join('');e.value=9});
$('#ck').value=cfg.key;$('#cm').value=cfg.model;$('#cn').value=NK();function ttl(){$('#ttl').textContent=NK()+'의 영어 서재'}
function tab(n){document.querySelectorAll('section').forEach(e=>e.hidden=e.id!=n);document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('on',['lib','mk','res','set'][i]==n));if(n=='lib')renderLib();if(n=='res')renderSL();scrollTo(0,0)}
function saveCfg(){cfg={key:$('#ck').value.trim(),model:$('#cm').value.trim()||'gemini-2.5-flash',nick:$('#cn').value.trim()||'향이'};SV('pp_c',cfg);ttl();alert('저장했습니다')}

/* 지문 보관함 */
const lab=p=>`${p.y} 고${p.g} ${p.m}월 ${p.no}번`;
function clearForm(){editId=null;$('#ln').value='';$('#lt').value=''}
function savePassage(){const o={y:+$('#ly').value,g:+$('#lg').value,m:+$('#lm').value,no:+$('#ln').value,text:$('#lt').value.trim()};
if(!o.no||!o.text)return alert('번호와 지문을 입력하세요');
const x=P.find(p=>p.id===editId)||P.find(p=>p.y==o.y&&p.g==o.g&&p.m==o.m&&p.no==o.no);
x?Object.assign(x,o):P.push({id:Date.now(),...o});SV('pp_p',P);clearForm();renderLib()}
function editP(id){const p=P.find(p=>p.id==id);editId=id;$('#ly').value=p.y;$('#lg').value=p.g;$('#lm').value=p.m;$('#ln').value=p.no;$('#lt').value=p.text;scrollTo(0,0)}
function delP(id){if(confirm('삭제할까요?')){P=P.filter(p=>p.id!=id);SV('pp_p',P);renderLib()}}
let LIM=60;const gk=p=>`${p.y} 고${p.g} ${p.m}월`;
function ff(){$('#fy').innerHTML='<option value="">연도</option>'+[...new Set(P.map(p=>p.y).concat(2026))].sort((a,b)=>b-a).map(y=>`<option>${y}</option>`).join('');$('#fg').innerHTML='<option value="">학년</option>'+[1,2,3].map(g=>`<option value="${g}">고${g}</option>`).join('');$('#fm').innerHTML='<option value="">월</option>'+[3,4,5,6,7,9,10,11].map(m=>`<option value="${m}">${m}월</option>`).join('')}
function flt(){const y=+$('#fy').value,g=+$('#fg').value,m=+$('#fm').value,t=$('#q').value.trim().toLowerCase(),r=$('#fn').value.trim();let a=0,b=999;if(r){const x=r.split(/[-~]/).map(Number);a=x[0]||0;b=x[1]||x[0]||999}
return P.filter(p=>(!y||p.y==y)&&(!g||p.g==g)&&(!m||p.m==m)&&p.no>=a&&p.no<=b&&(!t||p.text.toLowerCase().includes(t)))}
function mkFrom(id){const p=P.find(p=>p.id==id);$('#my').value=p.y;$('#mg').value=p.g;$('#mm').value=p.m;$('#mn').value=p.no;tab('mk')}
function renderLib(){const l=flt().sort((a,b)=>b.y-a.y||a.g-b.g||a.m-b.m||a.no-b.no),C={},G={};
l.forEach(p=>{C[gk(p)]=(C[gk(p)]||0)+1});l.slice(0,LIM).forEach(p=>{(G[gk(p)]=G[gk(p)]||[]).push(p)});
const ks=Object.keys(G),act=$('#fy').value||$('#fg').value||$('#fm').value||$('#fn').value||$('#q').value;
$('#plist').innerHTML=ks.length?ks.map((k,i)=>`<details ${act||i==0?'open':''}><summary>${k} <small>${C[k]}개</small></summary>${G[k].map(p=>`<div class="it"><div><b>${p.no}번</b><small>${esc(p.text.slice(0,50))}</small></div><div class="a"><button onclick="mkFrom(${p.id})">학습지</button><button class="g" onclick="editP(${p.id})">수정</button><button class="g" onclick="delP(${p.id})">삭제</button></div></div>`).join('')}</details>`).join('')+(l.length>LIM?`<button class="g" onclick="LIM+=60;renderLib()">더 보기 (${l.length-LIM}개 남음)</button>`:''):'<p>조건에 맞는 지문이 없습니다.</p>'}
async function readPdf(f){const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';window.np=pdf.numPages;
for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();let y=null;for(const it of c.items){if(y!==null&&Math.abs(it.transform[5]-y)>3)t+='\n';t+=it.str+' ';y=it.transform[5]}t+='\n'}return t.replace(/[ \t\u00a0]+/g,' ').replace(/ ?\n ?/g,'\n')}
async function readHwpx(f){const z=await JSZip.loadAsync(await f.arrayBuffer());let t='';
for(const n of Object.keys(z.files).filter(n=>/Contents\/section\d+\.xml$/.test(n)).sort()){const x=new DOMParser().parseFromString(await z.files[n].async('string'),'text/xml');
for(const e of x.getElementsByTagName('*')){if(e.localName=='p')t+='\n';else if(e.localName=='t')t+=e.textContent}}return t}
function split(t){const re=/(?:^|\s)(?:\[\s*(\d{2})\s*[~∼～-]\s*\d{2}\s*\]|(\d{2})\s*[.．]\s*(?=[가-힣\[(]))/g;let m,pos=[],n=18;
while((m=re.exec(t))){const k=+(m[1]||m[2]);if(k>=n&&k<=45&&k-n<=3){pos.push([k,m.index]);n=k+1}}
return pos.map((p,i)=>[p[0],t.slice(p[1],i+1<pos.length?pos[i+1][1]:p[1]+4000).trim().slice(0,4000)])}
async function importFile(f){if(!f)return;try{
if(typeof pdfjsLib!='undefined')pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const nm=f.name.toLowerCase();if(nm.endsWith('.hwp'))return alert('구형 .hwp는 앱에서 읽지 못합니다. 한글에서 "다른 이름으로 저장"으로 .hwpx 또는 PDF로 저장한 뒤 불러오세요.');
let t=nm.endsWith('.pdf')?await readPdf(f):nm.endsWith('.hwpx')?await readHwpx(f):await f.text();t=t.replace(/[ \t\u00a0]+/g,' ');const b={y:+$('#ly').value,g:+$('#lg').value,m:+$('#lm').value};const c=split(t);
if(!c.length){$('#lt').value=t.slice(0,6000);return alert('번호를 자동으로 나누지 못했습니다. 텍스트를 아래 칸에 넣었으니 번호를 입력해 저장하세요.')}
c.forEach(([no,text])=>{const x=P.find(p=>p.y==b.y&&p.g==b.g&&p.m==b.m&&p.no==no);x?x.text=text:P.push({id:Date.now()+no,...b,no,text})});
SV('pp_p',P);renderLib();const got=c.map(x=>x[0]),miss=[];for(let i=18;i<=45;i++)if(!got.includes(i))miss.push(i);
if(miss.length)$('#lt').value=t.slice(0,8000);
alert((window.np?'PDF '+window.np+'쪽을 읽었습니다.\n':'')+c.length+'개 저장: '+got.join(', ')+(miss.length?'\n\n찾지 못한 번호: '+miss.join(', ')+'\n전체 텍스트를 아래 입력칸에 넣어 두었으니 필요한 번호는 직접 나눠 저장하세요.':''));window.np=0}catch(e){alert('파일을 읽지 못했습니다: '+e.message)}}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({p:P,s:S})],{type:'application/json'}));a.download='passage-backup.json';a.click()}
async function restore(f){if(!f)return;try{const d=JSON.parse(await f.text());(d.p||[]).forEach(p=>{if(!P.find(x=>x.id==p.id))P.push(p)});(d.s||[]).forEach(s=>{if(!S.find(x=>x.id==s.id))S.push(s)});SV('pp_p',P);saveS();renderLib();alert('복원했습니다')}catch{alert('백업 파일이 올바르지 않습니다')}}

/* Gemini */
async function gem(prompt){if(!cfg.key)throw Error('설정 탭에서 API 키를 입력하세요');
const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:generateContent?key=${encodeURIComponent(cfg.key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:1,maxOutputTokens:30000}})});
const j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);
const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').replace(/^\s*```json|```\s*$/g,'').trim();return JSON.parse(t)}

function show(){tab('res')}
const star=n=>'★'.repeat(Math.max(0,Math.min(5,n|0))),L=(a,f)=>(a||[]).map(f).join(''),PH=(g,t,u)=>`<div class="ph"><span class="tag">${g}</span><h2>${t}</h2><span class="sb">${u}</span></div>`;
function render(s){const nk=esc(NK()),d=s.d,o=s.opts,T=`${s.y} 고${s.g} ${s.m}월 ${s.no}번`;
const en=L(d.sentences,x=>{let t=esc(x.en);(x.hl||[]).forEach(p=>{const q=esc(p);if(q&&t.includes(q))t=t.replace(q,()=>'<mark>'+q+'</mark>')});(d.conn||[]).forEach(c=>{const w=String(c).replace(/[^\w ]/g,'').trim();if(w)t=t.replace(new RegExp('\\b'+w+'\\b','i'),m=>'<u class="cn">'+m+'</u>')});return`<sup>${x.n}</sup>${t} `});
const p1=`<div class="pg">${PH('🍃 '+nk+'의 독해 전략','원문 심층 독해',T)}<div class="chips"><span>${esc(d.type)}</span><span>난이도 ${star(d.lv)}</span><span>⏱ ${esc(d.min)}분</span></div>
<div class="g2"><div class="ps"><h5>원문 · 핵심 구문 하이라이트</h5><p class="en">${en}</p></div><div class="cds">${L([['소재','co',d.topic],['제목','su',d.title],['주제','sk',d.subject],['요지','mo',d.gist],['핵심 요약','fo',d.summary]],([k,c,v])=>`<div class="cd ${c}"><b>[${k}]</b> ${esc(v)}</div>`)}</div></div>
<div class="v">논리 전개 흐름도</div><div class="fl">${L(d.flow,(f,i)=>`<div class="fb"><b>Step ${i+1}. ${esc(f.t)}</b><small>${esc(f.d)}</small></div>`)}</div>
<div class="v">해석</div><div class="ko">${L(d.sentences,x=>`<sup>${x.n}</sup>${esc(x.ko)} `)}</div>
<div class="eye"><b>🔎 출제자의 눈</b><div>${esc(d.eye?.intent)}</div><div>정답 근거: ${esc(d.eye?.evidence)}</div><ol>${L(d.eye?.strategy,x=>`<li>${esc(x)}</li>`)}</ol></div></div>`;
const p2=o.sc&&d.steps?.length?`<div class="pg">${PH('🌿 시각적 개념정리','한눈에 들어오는 핵심 정리',T)}<div class="ban">${esc(d.chars?.t)} 선생님 & ${esc(d.chars?.s)}의 1분 핵심 과외</div>
<div class="stg">${L(d.steps,(x,i)=>`<div class="st"><span class="chip">Step ${i+1}</span><b>${esc(x.title)}</b><div class="stb">${x.svg||''}<div class="bub"><b>${esc(x.who=='s'?d.chars?.s:d.chars?.t)}:</b> ${esc(x.say)}</div></div><button class="g np" onclick="redraw(${i},this)">🔄 그림 다시</button></div>`)}</div>
<div class="v">직관 비교 · ${esc(d.vs?.title)}</div><div class="vs"><div class="ok">✔ ${esc(d.vs?.good)}</div><b>VS</b><div class="no">✘ ${esc(d.vs?.bad)}</div></div>
<div class="kp"><b>💡 시험 직전 Key Point</b><ul>${L(d.keys,k=>`<li>${esc(k)}</li>`)}</ul></div></div>`:'';
let a='';
if(o.gr&&d.syntax?.length)a+='<div class="v">핵심 구문 뽀개기</div>'+L(d.syntax,x=>`<div class="sx"><div class="en">${esc(x.en)}</div><code>${esc(x.st)}</code><div>💡 ${esc(x.pt)}</div><div class="ko">${esc(x.ko)}</div></div>`)+(d.grammar?.length?'<div class="v">어법 포인트</div>'+L(d.grammar,x=>`<div class="sen"><b>${esc(x.p)}</b> ${esc(x.e)}</div>`):'');
if(o.vo&&d.vocab?.length)a+=`<div class="v">${nk}의 어휘 노트</div><table><tr><th>중요도</th><th>단어</th><th>뜻</th><th>연어·예문</th><th>유의어·파생어</th></tr>`+L(d.vocab,x=>`<tr><td class="s3">${star(x.i)}</td><td><b>${esc(x.w)}</b> <small>${esc(x.pos)}</small></td><td>${esc(x.m)}</td><td>${esc(x.ex)}</td><td>${esc(x.syn)}</td></tr>`)+'</table>';
if(o.ch&&d.choices?.length)a+='<div class="v">오답 함정 분석</div>'+L(d.choices,x=>`<div class="sen"><b>${num(x.n)}</b> <span class="tg">${esc(x.type)}</span> ${esc(x.why)}</div>`);

a+='<div class="ck">☐ 소리 내어 읽기 &nbsp;☐ 끊어읽기 표시 &nbsp;☐ 어휘 암기 &nbsp;☐ 셀프 테스트 &nbsp;☐ 오답 정리</div>'+(d.cheer?`<div class="cheer">${esc(d.cheer)}</div>`:'');
const p3=`<div class="pg">${PH('🍂 구문·어휘·테스트',nk+'의 실전 노트',T)}${a}</div>`;
const p4=o.qz?`<div class="pg">${PH('🌙 정답·해설','풀고 나서 채점하세요',T)}<b>[A]</b>`+L(d.qa,(x,i)=>` (${i+1}) ${esc(x.a)}`)+'<br><b>[B]</b>'+L(d.qb,(x,i)=>`<div class="sen">(${i+1}) ${esc(x.a)}</div>`)+(d.qc?`<b>[C]</b> ${esc(d.qc.a)}<br>`:'')+'<b>[D]</b>'+L(d.mcq,(x,i)=>`<div class="sen">(${i+1}) 정답 ${esc(x.a)} — ${esc(x.why)}</div>`)+'</div>':'';
